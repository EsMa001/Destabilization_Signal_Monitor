    - Befund: kein Implementierungsartefakt.

    - Der Sprung ist daten-/regelgetrieben:

    - GDELT `Germany/protest`: `28 -> 31`

    - Bridge-Marker `protest_marker` mit `severity=0.4` erzeugt per V1-Regel (`severity
