metadata:
  artifact_type: open_issues
  migration_status: initial_population
  baseline_decision_source: docs/planning/2026-05-09_baseline_decisions.md
  source_documents:
  - docs/requirements/OpenIssues.md
  - docs/traceability/TraceabilityMatrix.md
  - docs/planning/2026-05-09_wp08_software_derivation.md
  allowed_statuses:
  - candidate_open_issue
  - open_issue
  - resolved_issue
  - retired_issue
  notes:
  - Legacy free-text statuses were normalized to open_issue or resolved_issue for
    the YAML migration.
  - WP-09 added migration-governance follow-up issues where the recovered requirement
    baseline or verification baseline remains only partially formalized in the legacy
    source set.
  - From WP-10 onward, this YAML artifact is authoritative for migrated issue governance
    on hermes/vmodel-assessment.
  - WP-10 resolved OI-045 and OI-046 by declaring YAML authoritative for migrated
    artifacts and by hardening verification governance from direct test traceability
    evidence.
  - WP-11 completes the remaining GV-placeholder cleanup and leaves only genuinely
    methodological provisional software requirements open.
schema_guidance:
  required_fields:
  - id
  - title
  - statement
  - status
  - affected_artifact_ids
  - source_refs
  optional_fields:
  - resolution_note
  - resolution_type
  - escalation_required
