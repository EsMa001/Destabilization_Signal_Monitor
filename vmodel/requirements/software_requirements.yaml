metadata:
  artifact_type: software_requirements
  migration_status: initial_population
  baseline_decision_source: docs/planning/2026-05-09_baseline_decisions.md
  source_documents:
  - docs/requirements/ProtoSwR.md
  - docs/traceability/TraceabilityMatrix.md
  - docs/requirements/OpenIssues.md
  - vmodel/requirements/system_requirements.yaml
  classification_rules:
  - active_baseline
  - historical_origin
  - parameterized_capability
  - legacy_variant
  allowed_statuses:
  - candidate_baseline_requirement
  - accepted_baseline_requirement
  - implemented_requirement
  - provisional_requirement
  - retired_requirement
  notes:
  - Software requirements are derived from the normalized system layer and the legacy
    software requirement artifacts.
  - Bidirectional system<->software links are now populated.
  - Legacy fixed 10-country and 356-day wording is normalized to the accepted default
    baseline of 10 countries and 365 days where applicable.
  - PSwR-020..PSwR-035 are currently missing as explicit entries in ProtoSwR.md and
    were therefore recovered from the legacy traceability matrix and open-issue set
    as an initial low-risk migration step.
  - From WP-10 onward, this YAML artifact is authoritative for migrated software requirements
    on hermes/vmodel-assessment; legacy markdown remains historical source material
    only.
  - WP-10 normalized stale provisional statuses where stronger code/test/open-issue
    evidence showed the legacy traceability matrix status was outdated.
  - WP-10 retired PSwR-068 from the active baseline because the transitional Event
    not_available rule is superseded by the operational Event layer baseline.
  - WP-11 resolved the remaining status ambiguity for PSwR-046 by introducing a governed
    requirement-level verification artifact.
  - After WP-11, only PSwR-034 and PSwR-061 remain genuinely provisional in the migrated
    software baseline.
schema_guidance:
  required_fields:
  - id
  - title
  - statement
  - status
  - baseline_classification
  - source_refs
  - parent_system_ids
  - child_verification_ids
  optional_fields:
  - migration_tags
  - rationale
  - notes
  - supersedes
