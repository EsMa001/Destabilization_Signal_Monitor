metadata:
  artifact_type: stakeholder_requirements
  migration_status: initial_population
  baseline_decision_source: docs/planning/2026-05-09_baseline_decisions.md
  source_documents:
  - docs/requirements/ProtoScope.md
  - docs/requirements/ProtoSR.md
  classification_rules:
  - active_baseline
  - historical_origin
  - parameterized_capability
  - legacy_variant
  allowed_statuses:
  - candidate_baseline_requirement
  - accepted_baseline_requirement
  - implemented_requirement
  - provisional_requirement
  - retired_requirement
  notes:
  - Stakeholder requirements are normalized to the accepted 10-country and 365-day defaults where applicable.
  - Bidirectional trace fields are present; child links remain empty until formal system derivation is completed.
  - Historical-origin wording from the original markdown source is preserved via source_refs and migration_tags rather than as active baseline text.
schema_guidance:
  required_fields:
  - id
  - title
  - statement
  - status
  - baseline_classification
  - source_refs
  - parent_stakeholder_ids
  - child_system_ids
  optional_fields:
  - migration_tags
  - rationale
  - notes
  - supersedes
requirements:
- id: PSR-001
  title: Goal of the prototype
  statement: The prototype shall identify short-term anomalies in media and context data and make possible indications of political or societal destabilization visible.
