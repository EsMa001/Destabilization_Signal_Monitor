    id: PSR-024
  - file: docs/planning/2026-05-09_baseline_decisions.md
    role: baseline_decision_context
- id: PSR-025
  title: Peak attribution and event-alignment hardening
  statement: The prototype shall harden peak interpretation within the default 365-day historical trajectory so that global background waves are better separated from country-specific peaks, peaks are explicitly attributed, and event-supported versus weakly supported peak situations are distinguishable.
  status: candidate_baseline_requirement
  baseline_classification: active_baseline
  migration_tags:
  - normalized_from_356_day_variant
  - version_origin_v4_3_1
  parent_stakeholder_ids: []
  child_system_ids: []
  source_refs:
  - file: docs/requirements/ProtoSR.md
    id: PSR-025
  - file: docs/planning/2026-05-09_baseline_decisions.md
    role: baseline_decision_context
- id: PSR-026
  title: Analyst event registry and real-world alignment
  statement: The prototype shall provide a structured analyst event-registry and review path that links peaks and central trajectory phases per country to real-world events while keeping the core pipeline runnable without mandatory live-web dependency.
  status: candidate_baseline_requirement
  baseline_classification: active_baseline
  migration_tags:
