    role: baseline_decision_context
- id: PSR-021
  title: External validation and calibration
  statement: The prototype shall provide an explicit and traceable validation and calibration framework integrating historical reference episodes, metrics, and diagnosable calibration guidance for the multi-layer monitor.
  status: candidate_baseline_requirement
  baseline_classification: active_baseline
  migration_tags:
  - version_origin_v4_0
  parent_stakeholder_ids: []
  child_system_ids: []
  source_refs:
  - file: docs/requirements/ProtoSR.md
    id: PSR-021
  - file: docs/planning/2026-05-09_baseline_decisions.md
    role: baseline_decision_context
- id: PSR-022
  title: Operational freshness and responsiveness
  statement: The prototype shall explicitly expose and improve operational freshness and responsiveness so that snapshot statements distinguish clearly between fresh, aging, and stale signals.
  status: candidate_baseline_requirement
  baseline_classification: active_baseline
  migration_tags:
  - version_origin_v4_1
  parent_stakeholder_ids: []
  child_system_ids: []
  source_refs:
  - file: docs/requirements/ProtoSR.md
    id: PSR-022
  - file: docs/planning/2026-05-09_baseline_decisions.md
    role: baseline_decision_context
- id: PSR-023
  title: Governance and political stability dimension
  statement: The prototype shall integrate an explicit governance and political stability contribution space so that political capability, institutional stability, legitimacy, and socio-political cohesion are reflected systematically in snapshot, historical fusion, and validation.
  status: candidate_baseline_requirement
  baseline_classification: active_baseline
  migration_tags:
  - version_origin_v4_2
  parent_stakeholder_ids: []
  child_system_ids: []
  source_refs:
  - file: docs/requirements/ProtoSR.md
    id: PSR-023
  - file: docs/planning/2026-05-09_baseline_decisions.md
    role: baseline_decision_context
- id: PSR-024
  title: Comparative default baseline with parameterizable annual profiles
  statement: The prototype shall provide a default cross-country comparison baseline of 10 countries, with each country analyzed, compared, validated, and reported over a full default 365-day profile; the profile horizon shall remain parameterizable when needed.
  status: candidate_baseline_requirement
  baseline_classification: active_baseline
  migration_tags:
  - parameterized_capability
  - normalized_from_356_day_variant
  - version_origin_v4_3
  parent_stakeholder_ids: []
  child_system_ids: []
  source_refs:
