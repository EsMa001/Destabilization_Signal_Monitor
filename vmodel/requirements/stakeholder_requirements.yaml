  title: Peak attribution and event-alignment hardening
  statement: The prototype shall harden peak interpretation within the default 365-day
    historical trajectory so that global background waves are better separated from
    country-specific peaks, peaks are explicitly attributed, and event-supported versus
    weakly supported peak situations are distinguishable.
  status: candidate_baseline_requirement
