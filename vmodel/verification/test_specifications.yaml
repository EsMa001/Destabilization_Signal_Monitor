metadata:
  artifact_type: test_specifications
  migration_status: governance_hardened
  baseline_decision_source: docs/planning/2026-05-09_baseline_decisions.md
  source_documents:
  - docs/traceability/TraceabilityMatrix.md
  - docs/testing/TestStrategy.md
  - docs/testing/ValidationPlan.md
  allowed_statuses:
  - candidate_verification_artifact
  - accepted_verification_artifact
  - implemented_verification_artifact
  - retired_verification_artifact
  notes:
  - This initial migration captures explicit TV-* identifiers already present in the
    legacy traceability matrix.
  - Rows that only reference test files or generic pytest execution without an explicit
    TV-* identifier remain to be formalized in a later verification work package.
  - Explicit legacy TV-* identifiers remain authoritative where present.
  - For legacy rows without explicit TV-* IDs, WP-09 adds GV-* candidate governance
    placeholders so generic test references become machine-trackable without inventing
    legacy TV IDs.
schema_guidance:
  required_fields:
  - id
  - title
  - verification_type
  - linked_requirement_ids
  - source_refs
  - status
  optional_fields:
  - automation_status
  - implementation_refs
  - test_level
