<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Projektarchitektur: Country Destabilization Prototype">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 12px Arial, sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.4; rx: 10; }
      .box-blue { fill: #e0f2fe; stroke: #0284c7; }
      .box-green { fill: #dcfce7; stroke: #16a34a; }
      .box-orange { fill: #ffedd5; stroke: #ea580c; }
      .box-purple { fill: #ede9fe; stroke: #7c3aed; }
      .box-red { fill: #ffe4e6; stroke: #e11d48; }
      .box-gray { fill: #f1f5f9; stroke: #64748b; }
      .label { font: 700 13px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 11px Arial, sans-serif; fill: #334155; }
      .tiny { font: 400 9px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 6 4; }
      .boundary { fill: none; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 8 5; rx: 14; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
  </defs>
  <rect class="bg" width="100%" height="100%"/>
  <text x="24" y="34" class="title">Projektarchitektur: Country Destabilization Prototype</text>
  
  <text x="24" y="56" class="subtitle">Anforderungen-getriebene Analysepipeline mit klassischem Clusterpfad, Multi-Source-Fusion, API, Reporting und V-Model-Governance</text>
  <rect x="30" y="86" width="1138" height="610" class="boundary"/>
  <text x="48" y="110" class="small">Governed product baseline</text>

  <rect x="60" y="140" width="210" height="310" class="box box-blue"/>
  <text x="82" y="166" class="label">Rohdaten / Quellen</text>
  <text x="82" y="194" class="small">GDELT events</text>
  <text x="82" y="216" class="small">UCDP events</text>
  <text x="82" y="238" class="small">Bridge events</text>
  <text x="82" y="260" class="small">Country context</text>
  <text x="82" y="296" class="small">FAO FFPI / FPMA</text>
  <text x="82" y="318" class="small">UN Comtrade</text>
  <text x="82" y="340" class="small">GDACS, UNHCR</text>
