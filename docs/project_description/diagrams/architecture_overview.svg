  <text x="642" y="218" class="small">Monthly fusion history</text>
  <text x="642" y="240" class="small">Peak / event alignment</text>
  <text x="642" y="262" class="small">Run/reference comparison</text>

  <rect x="620" y="350" width="240" height="150" class="box box-purple"/>
  <text x="642" y="376" class="label">Outputs / Reporting</text>
  <text x="642" y="404" class="small">CSV / JSON exports</text>
  <text x="642" y="426" class="small">Plots</text>
  <text x="642" y="448" class="small">Handout Markdown</text>
  <text x="642" y="470" class="small">Review bundle</text>

  <rect x="920" y="140" width="200" height="150" class="box box-red"/>
  <text x="942" y="166" class="label">FastAPI MVP</text>
  <text x="942" y="194" class="small">Health / info</text>
  <text x="942" y="216" class="small">Options / config</text>
  <text x="942" y="238" class="small">Runs / status</text>
  <text x="942" y="260" class="small">Artifacts / bundle</text>

  <rect x="920" y="370" width="200" height="150" class="box box-gray"/>
  <text x="942" y="396" class="label">V-Model-Light</text>
  <text x="942" y="424" class="small">PSR / PSyR / PSwR</text>
  <text x="942" y="446" class="small">TV-* verification</text>
  <text x="942" y="468" class="small">OI-* open issues</text>
  <text x="942" y="490" class="small">2462 function links</text>

  <path d="M270 250 C300 230 300 210 330 200" class="arrow"/>
  <path d="M270 330 C300 360 300 395 330 410" class="arrow"/>
  <path d="M560 200 L620 200" class="arrow"/>
  <path d="M560 420 L620 420" class="arrow"/>
  <path d="M740 290 L740 350" class="arrow"/>
  <path d="M860 430 L920 430" class="arrow"/>
  <path d="M860 215 L920 215" class="arrow dashed"/>
  <path d="M1020 370 L1020 300" class="arrow dashed"/>

</svg>