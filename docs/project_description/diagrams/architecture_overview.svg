  <text x="82" y="404" class="tiny">data/* + config/default.yaml</text>

  <rect x="330" y="120" width="230" height="150" class="box box-green"/>
  <text x="352" y="146" class="label">Klassischer Clusterpfad</text>
  <text x="352" y="174" class="small">Feature builders</text>
  <text x="352" y="196" class="small">Subscores</text>
  <text x="352" y="218" class="small">Cluster scores</text>
  <text x="352" y="240" class="small">Stage / Trend / Confidence</text>

  <rect x="330" y="330" width="230" height="170" class="box box-green"/>
  <text x="352" y="356" class="label">V3+ Fusionpfad</text>
  <text x="352" y="384" class="small">Canonical observations</text>
  <text x="352" y="406" class="small">Source signals</text>
  <text x="352" y="428" class="small">Group scores</text>
  <text x="352" y="450" class="small">Fusion total score</text>
  <text x="352" y="472" class="small">Freshness / validation</text>

  <rect x="620" y="120" width="240" height="170" class="box box-orange"/>
